name: Schedule tick

# Vercel Cron on the Hobby plan can only fire once a day (see vercel.json and
# CLAUDE.md's "Environment gotchas"), but /api/cron/schedule-tick's own code
# assumes a 15-minute cadence (lib/opsState.ts's CRON_INTERVAL_MS, the
# scheduler "alive" heartbeat threshold, and how promptly a configured
# schedule actually fires). This workflow is the free external pinger that
# gap needed and never had -- GitHub Actions' own schedule trigger, no paid
# plan required.
#
# GitHub's schedule trigger is best-effort and can slip by several minutes
# under load; that's fine here since the route itself is idempotent per tick
# and schedule.service.ts refuses schedules closer than an hour apart.
#
# Deliberately NOT on the exact quarter-hour (:00/:15/:30/:45) -- GitHub's own
# docs call the start of every hour (and, in practice, every popular cron
# boundary) the highest-load time for the schedule trigger, and this is
# exactly where every other repo's `*/15 * * * *` piles up too. Observed
# 20-90 minute gaps between ticks on 24 Aug 2026 (should have been ~15) with
# the on-the-mark schedule, which let a real production sweep sit overdue for
# over 20 minutes before anything checked again. Offsetting to :07/:22/:37/:52
# dodges that specific pile-up.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Hit schedule-tick
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://pagespeed-auditor.vercel.app/api/cron/schedule-tick")
          echo "response status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::schedule-tick returned $status"
            exit 1
          fi

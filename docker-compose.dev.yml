# Local development stack.
#
# Deliberately does NOT include the Next app: Ship Studio runs `next dev` on the
# host and containerizing it would break the live preview. Only the pieces the
# host process needs are here, plus the worker.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Runtime is OrbStack (`brew install orbstack`); the `docker compose` CLI is
# identical, it just avoids Docker Desktop's business-subscription requirement.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: psa
      POSTGRES_PASSWORD: psa
      POSTGRES_DB: pagespeed_auditor
    ports:
      - "5432:5432"
    volumes:
      - psa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psa -d pagespeed_auditor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly is not optional: without it a container restart silently drops
    # the entire queue, and an in-flight sweep can only be recovered by the
    # slower DB-reconciliation path.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - psa_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  psa_pgdata:
  psa_redisdata:

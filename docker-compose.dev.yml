# Local development stack.
#
# Deliberately does NOT include the Next app: Ship Studio runs `next dev` on the
# host and containerizing it would break the live preview. Only the piece the
# host process needs is here.
#
# No Redis: it used to run here too, for the PSI rate limiter and the
# scheduler heartbeat. Both moved to Postgres (docs/DECISIONS.md #16) once
# BullMQ -- the one thing that actually needed Redis's blocking commands --
# was already gone. If a local redis container from before this change is
# still running, it's safe to stop; nothing in the app talks to it anymore.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Runtime is OrbStack (`brew install orbstack`); the `docker compose` CLI is
# identical, it just avoids Docker Desktop's business-subscription requirement.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: psa
      POSTGRES_PASSWORD: psa
      POSTGRES_DB: pagespeed_auditor
    ports:
      - "5432:5432"
    volumes:
      - psa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psa -d pagespeed_auditor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  psa_pgdata:
